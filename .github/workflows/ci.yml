name: ci

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.preset }}-${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        preset: [linux, windows]
        config: [debug, release]
        exclude:
          - os: ubuntu-latest
            preset: windows
          - os: windows-latest
            preset: linux
    steps:
      - uses: actions/checkout@v4

      # The render seam links SDL3 and SDL3's own configure refuses to build
      # without X11 or Wayland development headers ("SDL could not find X11 or
      # Wayland development libraries"). ubuntu-latest ships neither, so install
      # what SDL3's Linux README lists for its X11/Wayland video backends.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}-${{ matrix.config }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-${{ matrix.config }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}-${{ matrix.config }}
