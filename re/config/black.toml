# Per-title recompilation config for black.
#
# Addresses and reasoning only: no ROM bytes and no dump fingerprints.
# Generated by tools/stage_title_config.py from a local coverage ingest;
# pkmn_bankgen --title-config turns this into per-bank recompiler config.

[title]
id = "black"

# A module copied at run time to a base no bank declares. The module's own
# guest address is declared_base + module_span_start, and the copy lives at
# guest_span_start; both resolve from the module's bytes, so no dumped bytes
# are needed. Declaring the copy is what lets the recompiler's CFG walk
# reach the relocated code (the finder reports these bases as 'undeclared
# alias candidates' until it is told).

# BISECT 2026-10-16: the two ARM7 aliases were DISABLED because declaring them
# hung the boot even with no seeds (arm7 bank 236 fns, arm9 parked at
# pc9=0x01FF8010, vblank9=0), while aliases off booted (arm7 bank 49 fns, splash
# b45f04f74705 at t=6.27 s). Root cause found 2026-10-19: an alias range is not
# uniformly module content - it carries runtime-materialized pages (the coverage
# ingest itself counts 17 page versions "not in ROM", and the ARM7 WRAM spans
# contain pages at 0x03800000/0x03809000). A dispatch row with no validation is
# selected on its address alone, so the bank ran module-derived code where the
# guest held something else. pkmn_bankgen now recompiles an alias-declaring bank
# with the recompiler's --validate-live-bytes, which makes every row prove the
# bytes at the pc before it runs. Evidence and the three-way comparison:
# re/notes/recompilation.md.

[[alias]]
cpu           = "arm7"
runtime_start = 0x02fe0000
source_start  = 0x02391a58
size          = 0x00017000
name          = "arm7_alias_02fe0000"
note          = "resident at a base no bank declares; recompile the module at this base, no dumped bytes required"

# 11 captured page(s); module 0x11A58..0x28A58 -> guest 0x02FE0000..0x02FF7000; declared base 0x02380000.

[[alias]]
cpu           = "arm7"
runtime_start = 0x037f8000
source_start  = 0x02380644
size          = 0x00011000
name          = "arm7_alias_037f8000"
note          = "resident at a base no bank declares; recompile the module at this base, no dumped bytes required"

# 14 captured page(s); module 0x644..0x11644 -> guest 0x037F8000..0x03809000; declared base 0x02380000.

# Observed Tier-3 entry points, replayed as [[entry_point]] seeds. The ARM7
# module is byte-identical across the four Gen 5 titles (same image SHA-1), so
# it is relocated to the same bases and its observed entry points are shared:
# re/config/arm7/seeds/ serves every title's config, and only the ARM9 half
# below is title-specific.

[[seed_file]]
cpu  = "arm7"
path = "arm7/seeds/arm7_arm7_02fce5a8.toml"

[[seed_file]]
cpu  = "arm7"
path = "arm7/seeds/arm7_arm7_037f79bc.toml"

[[seed_file]]
cpu  = "arm9"
path = "black/seeds/arm9_arm9_02004000.toml"

# Addresses that resolved to no ROM page (the ITCM copy and other
# runtime-materialized code) stay in the ingest output: they need the
# captured-bytes bank, which is ROM-derived and never checked in.

# Guest-instruction patches applied by pkmn_bankgen to the emitted shard C
# after recompilation. Address plus semantic kind only; no ROM bytes.
# A patch address must exist in an emitted shard or bankgen fails.

[[patch]]
address = 0x02075F7C
kind    = "skip_call"
reason  = "lock_leave_raw id-mismatch assert: leaving an idle lock is a no-op"
